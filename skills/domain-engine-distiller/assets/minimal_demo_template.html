<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ENGINE_NAME}} - 10秒极简体验 Playground</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #0b0d19;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #viewport { width: 100vw; height: 100vh; display: block; }
    #overlay {
      position: absolute;
      top: 24px;
      left: 24px;
      background: rgba(15, 20, 35, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 210, 255, 0.3);
      padding: 18px 24px;
      border-radius: 12px;
      max-width: 400px;
      box-shadow: 0 12px 36px rgba(0,0,0,0.5);
    }
    h1 { font-size: 18px; color: #00d2ff; margin-bottom: 6px; }
    p { font-size: 13px; color: #a0aec0; line-height: 1.5; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(0, 210, 255, 0.15);
      color: #00d2ff;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div id="viewport"></div>
  <div id="overlay">
    <div class="badge">{{DOMAIN_NAME}} 引擎</div>
    <h1>{{ENGINE_NAME}}</h1>
    <p>{{DESCRIPTION}}</p>
  </div>

  <script type="module">
    // 实例化与极简运行逻辑挂载
    console.log("{{ENGINE_NAME}} Playground 启动中...");
  </script>
</body>
</html>
